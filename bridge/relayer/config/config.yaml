global:
    debug-listen-addr: 127.0.0.1:5183
    metrics-listen-addr: 127.0.0.1:5184
    timeout: 10s
    memo: ""
    light-cache-size: 20
    log-level: info
    ics20-memo-limit: 0
    max-receiver-size: 150
chains:
    osmotestnet:
        type: cosmos
        value:
            key-directory: /workspaces/skychainPOS/bridge/relayer/keys/osmo-test-5
            key: relayer-osmo
            chain-id: osmo-test-5
            rpc-addr: https://rpc.testnet.osmosis.zone:443
            backup-rpc-addrs: []
            account-prefix: osmo
            keyring-backend: test
            dynamic-gas-price: false
            gas-adjustment: 1.5
            gas-prices: 0.025uosmo
            min-gas-amount: 1
            max-gas-amount: 0
            debug: true
            timeout: 15s
            block-timeout: ""
            output-format: json
            sign-mode: direct
            extra-codecs: []
            coin-type: 118
            signing-algorithm: ""
            broadcast-mode: batch
            min-loop-duration: 0s
            extension-options: []
            feegrants: null
    skynet:
        type: cosmos
        value:
            key-directory: /workspaces/skychainPOS/bridge/relayer/keys/skynet
            key: relayer-sky
            chain-id: skynet
            rpc-addr: http://127.0.0.1:26657
            backup-rpc-addrs: []
            account-prefix: sky
            keyring-backend: test
            dynamic-gas-price: false
            gas-adjustment: 1.3
            gas-prices: 0.025usky
            min-gas-amount: 1
            max-gas-amount: 0
            debug: true
            timeout: 10s
            block-timeout: ""
            output-format: json
            sign-mode: direct
            extra-codecs: []
            coin-type: 118
            signing-algorithm: ""
            broadcast-mode: batch
            min-loop-duration: 0s
            extension-options: []
            feegrants: null
paths:
    sky-osmo:
        src:
            chain-id: skynet
        dst:
            chain-id: osmo-test-5
        src-channel-filter:
            rule: ""
            channel-list: []
