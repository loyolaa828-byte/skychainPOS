syntax = "proto3";
package skynet.skynet.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "skynet/x/skynet/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "skynet/x/skynet/Params";
  option (gogoproto.equal) = true;
  
}